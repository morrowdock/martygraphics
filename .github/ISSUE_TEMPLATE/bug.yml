name: Bug report
description: A crash, a wrong render, a broken example or a documentation error.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data only. Do not paste credentials, personal data or private course material.
        For a vulnerability, use the private security report instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Release or commit
      description: The tag (for example v0.1.0) or the full commit SHA you used.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: macOS or iOS version, Swift version, Mac model.
      placeholder: macOS 26.6, Swift 6.3, Apple silicon
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest JSON document or code, and the exact command, for example `marty-solid check --strict file.json`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The check report, the refusal reason and part, or the crash log.
      render: text
