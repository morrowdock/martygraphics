name: CI
# Every pull request and every push to main run the `hygiene` and `macos` jobs.
# Branch protection on main requires `hygiene` (and the maintainer's local
# validation status); `macos` is not required, so a slow hosted Mac never holds
# a merge. Maintainers read it and fix or revert at once when it is red.
# Maintainers can also dispatch the workflow by hand with pinned SHAs.
#
# Safety: `pull_request` only (never `pull_request_target`), so a fork PR runs
# with a read-only token and no secrets. No caches (a cache shared across PRs
# could be poisoned). Checkouts do not persist credentials.
#
# Both jobs check out the ACTUAL head commit, not the synthetic merge ref, so
# the result belongs to one real, reproducible SHA (the same SHA that local
# receipts and the DCO range name). This is sound ONLY because branch
# protection requires branches to be up to date before merging: the PR head
# then already contains the latest main. The push run on main after a merge is
# a late safety net, not the gate.
#
# A manual dispatch attaches its check runs to the dispatched ref's tip, not to
# inputs.head_sha. To publish a PR's required checks, dispatch --ref <PR branch>
# with head_sha equal to that branch's tip; --ref main never satisfies them.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full PR base commit SHA
        required: true
      head_sha:
        description: Full actual PR head commit SHA (not the synthetic merge)
        required: true
permissions:
  contents: read
# A new push to a PR cancels that PR's older runs. Pushes to main and
# dispatches each get their own group, so they never cancel or replace a run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha || github.sha }}
      - name: Resolve commit range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          REF_SHA: ${{ github.sha }}
          IN_BASE: ${{ inputs.base_sha }}
          IN_HEAD: ${{ inputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=$PR_BASE; head=$PR_HEAD ;;
            push) base=$PUSH_BEFORE; head=$REF_SHA ;;
            workflow_dispatch) base=$IN_BASE; head=$IN_HEAD ;;
            *) echo "::error::Unexpected event $EVENT"; exit 1 ;;
          esac
          sha() { [[ $1 =~ ^[0-9a-fA-F]{40}$ ]]; }
          sha "$head" || { echo "::error::Head is not a full commit SHA"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$head^{commit}")" ] \
            || { echo "::error::Checkout is not the head commit"; exit 1; }
          if [ "$EVENT" = workflow_dispatch ] && [ "$(git rev-parse "$head^{commit}")" != "$(git rev-parse "$REF_SHA^{commit}")" ]; then
            # Evidence only (for example a fork PR head): this run's checks
            # attach to the ref's tip, so they cannot satisfy a PR's required checks.
            echo "::warning::head_sha is not the dispatched ref's tip ($REF_SHA). These check runs attach to $REF_SHA and do not satisfy a PR's required checks; dispatch --ref <PR branch> with head_sha equal to its tip."
          fi
          if [ "$EVENT" = push ]; then
            # A new branch has an all-zero `before`; a force push can name a
            # commit that is gone. Then check the pushed head commit only.
            # This can miss DCO on earlier commits of a multi-commit push.
            # Accepted: main takes only squash merges of PRs, force pushes are
            # disabled, and branch protection includes administrators.
            if [[ $base =~ ^0{40}$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              if git rev-parse -q --verify HEAD^ >/dev/null; then
                echo "::warning::Push base $base is not usable; checking the head commit only"
                base=$(git rev-parse HEAD^)
              else
                echo "::warning::Head is a root commit; checking it alone"
                base=root
              fi
            fi
          fi
          [ "$base" = root ] || sha "$base" || { echo "::error::Base is not a full commit SHA"; exit 1; }
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$head" >> "$GITHUB_ENV"
          echo "Range: $base..$head ($EVENT)"
      - name: Whitespace
        shell: bash
        run: |
          if [ "$BASE_SHA" = root ]; then git show --format= --check HEAD
          else git diff --check "$BASE_SHA...$HEAD_SHA"; fi
      - name: Tool tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: DCO sign-off
        shell: bash
        run: |
          if [ "$BASE_SHA" = root ]; then
            git show -s --format=%B HEAD | grep -Eq '^Signed-off-by: .+ <[^<>[:space:]]+@[^<>[:space:]]+>$' \
              || { echo "Missing DCO sign-off: $HEAD_SHA" >&2; exit 1; }
          else python3 tools/check_dco.py "$BASE_SHA" "$HEAD_SHA"; fi
      - name: File manifest
        run: python3 tools/validate_local.py --check-files
  # Hosted macOS build/tests on GitHub's free standard runner (not a larger,
  # paid runner). GPU-dependent tests already XCTSkip when no Metal ray-tracing
  # device exists (hosted VMs have no real GPU). Local native receipts stay
  # required for GPU and iOS-simulator checks (docs/VERIFY-ON-MAC.md).
  #
  # Speed: the tests run in four shards on four runners at the same time
  # (about 13 minutes instead of about 43 in one job). Each test still runs
  # alone and in order inside its shard; nothing runs in parallel inside one
  # process, because some tests assert wall-clock limits. Each split is a
  # `--filter X` shard plus a `--skip X` shard with the SAME pattern, so every
  # test runs in exactly one shard, including new ones. A filter shard fails if
  # it runs no test (for example after a rename). Still no caches.
  macos-shard:
    name: macos-${{ matrix.shard }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [engine-solid, engine-rest, solid3d-golden, solid3d-rest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha || github.sha }}
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version
          xcodebuild -version
          sw_vers
      - name: Run packages
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          mkdir -p logs
          fail=0
          run() { # name, command...
            local name=$1; shift
            echo "::group::$name"
            local t=$SECONDS
            if "$@" 2>&1 | tee "logs/$name.log"; then echo "PASS $name $((SECONDS-t))s" | tee -a logs/summary.txt
            else echo "FAIL $name $((SECONDS-t))s" | tee -a logs/summary.txt; fail=1; fi
            echo "::endgroup::"
          }
          ran() { # name: a filter shard must run at least one test
            if ! grep -Eq 'Executed [1-9][0-9]* tests?, with' "logs/$1.log"; then
              echo "FAIL $1 ran no test" | tee -a logs/summary.txt; fail=1
            fi
          }
          ENGINE='^MartyGraphicsTests\.Solid'
          GOLDEN='^MartySolidCLITests\.MartySolidCLITests/testCheckOutputIsByteIdenticalToTheGoldenFiles$'
          case "$SHARD" in
            engine-solid)
              run root-test-solid swift test --jobs 2 --filter "$ENGINE"
              ran root-test-solid ;;
            engine-rest)
              run root-build swift build --jobs 2
              run root-test-rest swift test --jobs 2 --skip "$ENGINE" ;;
            solid3d-golden)
              run Examples-Solid3D-test-golden swift test --jobs 2 --package-path Examples/Solid3D --filter "$GOLDEN"
              ran Examples-Solid3D-test-golden ;;
            solid3d-rest)
              run Examples-Solid3D-test-rest swift test --jobs 2 --package-path Examples/Solid3D --skip "$GOLDEN"
              for p in Examples/Turbofan Examples/KeySwitch3D tools/SceneValidator; do
                n=$(echo "$p" | tr / -)
                run "$n-test" swift test --jobs 2 --package-path "$p"
              done
              for p in Examples/Showcase Examples/PathTrace; do
                run "$(echo "$p" | tr / -)-build" swift build --jobs 2 --package-path "$p"
              done ;;
            *) echo "::error::Unknown shard $SHARD"; exit 1 ;;
          esac
          exit $fail
      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-test-logs-${{ matrix.shard }}
          path: logs/
          if-no-files-found: warn
  # The required check. It passes only when all four shards passed; a failed,
  # cancelled or skipped shard fails it.
  macos:
    name: macos
    needs: macos-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All macOS shards passed
        env:
          RESULT: ${{ needs.macos-shard.result }}
        run: |
          echo "macos-shard result: $RESULT"
          [ "$RESULT" = success ]
