name: optional hosted checks
# Maintainers may opt in to hosted Ubuntu execution. No automatic PR/fork jobs.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full PR base commit SHA
        required: true
      head_sha:
        description: Full actual PR head commit SHA (not the synthetic merge)
        required: true
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
      - run: git show --format= --check HEAD
      - run: python3 -m unittest discover -s tools/tests -v
      - env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: python3 tools/check_dco.py "$BASE_SHA" "$HEAD_SHA"
  # SwiftUI/SceneKit cannot build on ubuntu-latest. Required Mac commands:
  # swift build && swift test (see docs/VERIFY-ON-MAC.md).
  # This job stays explicitly skipped; hygiene success is not build validation.
  apple-build:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Mac verification required; Apple frameworks unavailable on Linux"
